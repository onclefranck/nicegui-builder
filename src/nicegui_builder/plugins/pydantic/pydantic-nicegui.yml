# Numeric fields
int|std:
  methods: number
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
    precision: 0
  props: clearable
int|slider:
  methods: slider
  params:
    value: "{{ fieldvalue }}"
int|knob:
  methods: knob
  params:
    value: "{{ fieldvalue }}"
int|label:
  methods: label
  params:
    text: "{{ fieldvalue }}"

float|std:
  methods: number
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
    precision: 2
  props: clearable
float|slider:
  methods: slider
  params:
    value: "{{ fieldvalue }}"
float|knob:
  methods: knob
  params:
    value: "{{ fieldvalue }}"
float|label:
  methods: label
  params:
    text: "{{ fieldvalue }}"

Decimal|std:
  methods: number
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
    precision: 2
  props: clearable
Decimal|label:
  methods: label
  params:
    text: "{{ fieldvalue }}"

# Boolean fields
bool|std:
  methods: checkbox
  params:
    value: "{{ fieldvalue }}"
    text: "{{ attributes_title }}"
bool|switch:
  methods: switch
  params:
    value: "{{ fieldvalue }}"
    text: "{{ attributes_title }}"
bool|select:
  methods: select
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
    options:
      - true
      - false
  props: clearable
bool|label:
  methods: label
  params:
    text: "{{ fieldvalue }}"

# Choice fields
Literal|std:
  methods: select
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
    options: "{{ choices }}"
  props: clearable
Literal|radio:
  methods: radio
  params:
    value: "{{ fieldvalue }}"
    options: "{{ choices }}"
Literal|label:
  methods: label
  params:
    text: "{{ fieldvalue }}"

Enum|std:
