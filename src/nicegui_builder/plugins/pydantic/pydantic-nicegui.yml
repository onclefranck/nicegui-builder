# String-like fields
str|std:
  methods: input
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
    placeholder: "{{ attributes_description }}"
  props: clearable
str|textarea:
  methods: textarea
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
    placeholder: "{{ attributes_description }}"
  props: autogrow clearable
str|password:
  methods: input
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
    password: True
    password_toggle_button: True
    placeholder: "{{ attributes_description }}"
str|email:
  methods: input
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
    placeholder: "{{ attributes_description }}"
  props: type=email clearable
str|search:
  methods: input
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
    placeholder: "{{ attributes_description }}"
  props: clearable
str|color:
  methods: color_input
  params:
    value: "{{ fieldvalue }}"
    label: "{{ attributes_title }}"
str|label:
  methods: label
  params:
    text: "{{ fieldvalue }}"

