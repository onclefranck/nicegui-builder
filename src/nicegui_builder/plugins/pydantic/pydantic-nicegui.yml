# String-like fields
str|std:
  methods: input
  params:
    value: _{fieldvalue}
    label: _{attributes_title}
    placeholder: _{attributes_description}
  props: clearable
str|textarea:
  methods: textarea
  params:
    value: _{fieldvalue}
    label: _{attributes_title}
    placeholder: _{attributes_description}
  props: autogrow clearable
str|password:
  methods: input
  params:
    value: _{fieldvalue}
    label: _{attributes_title}
    password: True
    password_toggle_button: True
    placeholder: _{attributes_description}
str|email:
  methods: input
  params:
    value: _{fieldvalue}
    label: _{attributes_title}
    placeholder: _{attributes_description}
  props: type=email clearable
str|search:
  methods: input
  params:
    value: _{fieldvalue}
    label: _{attributes_title}
    placeholder: _{attributes_description}
  props: clearable
str|color:
  methods: color_input
  params:
    value: _{fieldvalue}
    label: _{attributes_title}
str|label:
  methods: label
  params:
    text: _{fieldvalue}

