# Numeric fields
int|std:
  methods: number
  params:
    value: _{fieldvalue}
    label: _{attributes_title}
    precision: 0
  props: clearable
int|slider:
  methods: slider
  params:
    value: _{fieldvalue}
int|knob:
  methods: knob
  params:
    value: _{fieldvalue}
int|label:
  methods: label
  params:
    text: _{fieldvalue}

float|std:
  methods: number
  params:
    value: _{fieldvalue}
    label: _{attributes_title}
    precision: 2
  props: clearable
float|slider:
  methods: slider
  params:
    value: _{fieldvalue}
float|knob:
  methods: knob
  params:
    value: _{fieldvalue}
float|label:
  methods: label
  params:
    text: _{fieldvalue}

Decimal|std:
  methods: number
  params:
    value: _{fieldvalue}
    label: _{attributes_title}
    precision: 2
  props: clearable
Decimal|label:
  methods: label
  params:
    text: _{fieldvalue}

# Boolean fields
bool|std:
  methods: checkbox
  params:
    value: _{fieldvalue}
    text: _{attributes_title}
bool|switch:
  methods: switch
  params:
    value: _{fieldvalue}
    text: _{attributes_title}
bool|select:
  methods: select
  params:
    value: _{fieldvalue}
    label: _{attributes_title}
    options:
      - true
      - false
  props: clearable
bool|label:
  methods: label
  params:
    text: _{fieldvalue}

