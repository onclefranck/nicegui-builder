- card.tight:
    classes: w-full max-w-3xl mx-auto p-4 gap-4
    children:
    - label:
        params:
          text: "{{ source_class.__name__ }}"
        classes: text-h5
    - label:
        params:
          text: Track one participant, one contest, and the desk's current administrative mood.
        classes: text-body2 text-grey-7
    - field__participant_name:
    - field__contest_title:
    - row:
        classes: w-full gap-3
        children:
        - field__status:
        - field__checked_in_at:
            methods: datetime_split
    - field__notes:
