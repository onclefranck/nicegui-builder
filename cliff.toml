[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""

body = """
{% if version -%}
  {% if previous.version -%}
## [{{ version }}](https://github.com/onclefranck/nicegui-builder/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
  {% else -%}
## [{{ version }}](https://github.com/onclefranck/nicegui-builder/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
  {% endif -%}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} ({{ commit.scope }}){% endif %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/onclefranck/nicegui-builder/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""

footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^dev", group = "Development" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Tests" },
  { message = "^chore", group = "Chores" },
  { message = "^wip", group = "Work in Progress" },
  { message = "^revert", group = "Reverts" },
]
